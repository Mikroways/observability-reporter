[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle (warnings)
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "BLE",  # flake8-blind-except
  "PL",   # pylint
  "RUF",  # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
# En los tests los valores literales en las comparaciones son lo esperado.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
