# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: ServiceAccount e IRSA
templates:
  - serviceaccount.yaml
  - cronjob.yaml
  - configmap.yaml
  - configmap-queries.yaml
  - secret.yaml
release:
  name: rel
tests:
  - it: Crea el ServiceAccount del release, sin anotaciones
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: rel-hreidar
      - isNull:
          path: metadata.annotations

  - it: Anota el rol de IRSA cuando se define roleArn
    template: serviceaccount.yaml
    set:
      serviceAccount.roleArn: arn:aws:iam::123456789012:role/hreidar
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/hreidar

  - it: Acepta expresiones gotpl en roleArn y suma las anotaciones extra
    template: serviceaccount.yaml
    set:
      global.awsAccountId: "123456789012"
      serviceAccount.roleArn: arn:aws:iam::{{ .Values.global.awsAccountId }}:role/hreidar
      serviceAccount.annotations:
        mikroways.net/owner: sre
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/hreidar
      - equal:
          path: metadata.annotations["mikroways.net/owner"]
          value: sre

  - it: No crea el ServiceAccount cuando create es false
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: El CronJob usa el ServiceAccount indicado por nombre
    template: cronjob.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: irsa-existente
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: irsa-existente
