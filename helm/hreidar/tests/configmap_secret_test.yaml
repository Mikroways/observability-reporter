# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: ConfigMaps de consultas y de entorno, y Secret
templates:
  - configmap-queries.yaml
  - configmap.yaml
  - secret.yaml
release:
  name: rel
tests:
  - it: Crea el ConfigMap de consultas con la estructura de queries.yaml
    template: configmap-queries.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: rel-hreidar-queries
      - matchRegex:
          path: data["queries.yaml"]
          pattern: 'title: Reporte de métricas'
      - matchRegex:
          path: data["queries.yaml"]
          pattern: 'query: up == 0'

  - it: Arma el archivo de consultas con la key indicada y acepta gotpl
    template: configmap-queries.yaml
    set:
      queries.key: report.yaml
      global.tenant: produccion
      queries.config:
        title: Reporte de {{ .Values.global.tenant }}
        queries:
          - title: Targets caídos
            org_id: "{{ .Values.global.tenant }}"
            query: up == 0
    asserts:
      - matchRegex:
          path: data["report.yaml"]
          pattern: 'title: Reporte de produccion'
      - matchRegex:
          path: data["report.yaml"]
          pattern: "org_id: .produccion."

  - it: No crea el ConfigMap de consultas si se usa uno existente
    template: configmap-queries.yaml
    set:
      queries.existingConfigMap: mis-queries
    asserts:
      - hasDocuments:
          count: 0

  - it: Crea el ConfigMap de entorno con las variables de config.env
    template: configmap.yaml
    set:
      global.mimirUrl: http://mimir/prometheus/api/v1/query
      config.env:
        METRICS_URL: "{{ .Values.global.mimirUrl }}"
        SES_TO: reportes@example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: rel-hreidar
      - equal:
          path: data.METRICS_URL
          value: http://mimir/prometheus/api/v1/query
      - equal:
          path: data.SES_TO
          value: reportes@example.com

  - it: No crea el Secret si no hay secretEnv
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Crea el Secret con las credenciales SMTP de SES
    template: secret.yaml
    set:
      config.secretEnv:
        SES_SMTP_USER: usuario
        SES_SMTP_PASSWORD: contrasena
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: rel-hreidar
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.SES_SMTP_USER
          value: usuario
      - equal:
          path: stringData.SES_SMTP_PASSWORD
          value: contrasena
