{{- if .Values.config.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hreidar.fullname" . }}
  labels:
    {{- include "hreidar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.config.secretEnv }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
