{{- $queriesPath := include "hreidar.queriesPath" . }}
{{- $env := merge (default dict .Values.env | deepCopy) (dict "REPORT_CONFIG" $queriesPath) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hreidar.fullname" . }}
  labels:
    {{- include "hreidar.labels" . | nindent 4 }}
  {{- with .Values.cronjob.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ required "cronjob.schedule es obligatorio" .Values.cronjob.schedule | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  {{- with .Values.cronjob.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- with .Values.cronjob.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.cronjob.successfulJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.cronjob.failedJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ . }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        {{- include "hreidar.labels" . | nindent 8 }}
    spec:
      {{- with .Values.cronjob.backoffLimit }}
      backoffLimit: {{ . }}
      {{- end }}
      {{- with .Values.cronjob.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with .Values.cronjob.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
            checksum/queries: {{ include (print $.Template.BasePath "/configmap-queries.yaml") . | sha256sum }}
            checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
            {{- with .Values.cronjob.podAnnotations }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          labels:
            {{- include "hreidar.selectorLabels" . | nindent 12 }}
            {{- with .Values.cronjob.podLabels }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "hreidar.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ .Chart.Name }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- with .Values.cronjob.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.cronjob.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                {{- range $key, $value := $env }}
                - name: {{ $key }}
                  value: {{ tpl (toString $value) $ | quote }}
                {{- end }}
              {{- if or .Values.config.env .Values.config.secretEnv .Values.extraEnvFrom }}
              envFrom:
                {{- if .Values.config.env }}
                - configMapRef:
                    name: {{ include "hreidar.fullname" . }}
                {{- end }}
                {{- if .Values.config.secretEnv }}
                - secretRef:
                    name: {{ include "hreidar.fullname" . }}
                {{- end }}
                {{- with .Values.extraEnvFrom }}
                {{- tpl (toYaml .) $ | nindent 16 }}
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: queries
                  mountPath: {{ trimSuffix "/" .Values.queries.mountPath }}
                  readOnly: true
                {{- /* readOnlyRootFilesystem necesita un /tmp escribible */}}
                - name: tmp
                  mountPath: /tmp
                {{- with .Values.extraVolumeMounts }}
                {{- tpl (toYaml .) $ | nindent 16 }}
                {{- end }}
          volumes:
            - name: queries
              configMap:
                name: {{ include "hreidar.queriesConfigMapName" . }}
            - name: tmp
              emptyDir: {}
            {{- with .Values.extraVolumes }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
