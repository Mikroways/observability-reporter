apiVersion: v2
name: hreidar
description: >-
  Reporte periódico de métricas de Grafana Mimir / Prometheus, enviado por
  correo con Amazon SES.
type: application
# Versión del chart. El pipeline la lee de acá y falla si ya está publicada, así
# que todo cambio bajo helm/ necesita su bump.
version: 0.0.4
# Versión de la aplicación: el tag de la imagen que despliega el chart. Solo sube
# cuando se publica una imagen nueva.
appVersion: "0.0.2"
keywords:
  - prometheus
  - mimir
  - observability
  - reporting
  - cronjob
home: https://github.com/Mikroways/observability-reporter
sources:
  - https://github.com/Mikroways/observability-reporter
