---
name: Helm

on:
  push:
    branches: [main, development]
    paths: ["helm/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["helm/**", ".github/workflows/helm.yml"]

permissions:
  contents: read

env:
  CHART: helm/hreidar
  HELM_VERSION: v4.3.1
  UNITTEST_VERSION: "1.2.1"

jobs:
  test:
    name: Lint y unit tests del chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Instalar helm-unittest
        # helm verifica la firma de los plugins y helm-unittest no publica una.
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$UNITTEST_VERSION" --verify=false

      - name: Correr helm lint
        run: helm lint --strict "$CHART"

      - name: Correr los unit tests del chart
        run: helm unittest "$CHART"

  publish:
    name: Empaquetar y publicar el chart
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verificar que la versión del chart no esté publicada
        id: chart
        # La versión sale de Chart.yaml. Si ya está en el registry el chart
        # cambió sin bump, y el pipeline corta antes de pisar nada.
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(helm show chart "$CHART" | grep '^name:' | cut -d: -f2 | tr -d '[:space:]')
          version=$(helm show chart "$CHART" | grep '^version:' | cut -d: -f2 | tr -d '[:space:]')
          repo="ghcr.io/${OWNER,,}/charts"
          echo "$TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          if helm show chart "oci://$repo/$name" --version "$version" >/dev/null 2>&1; then
            echo "::error file=$CHART/Chart.yaml::La versión $version de $name ya está publicada en $repo. Subí version: en $CHART/Chart.yaml."
            exit 1
          fi
          echo "El chart $name $version no está publicado todavía."
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Empaquetar el chart
        id: package
        run: |
          set -euo pipefail
          helm package "$CHART" --destination dist
          echo "file=$(ls dist/*.tgz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ steps.package.outputs.file }}

      - name: Publicar el chart en GHCR
        # Solo desde main. En development y en los pull requests el chart se
        # empaqueta y queda como artefacto del run, sin publicarse.
        if: github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.package.outputs.file }}
          REPO: ${{ steps.chart.outputs.repo }}
        run: helm push "$FILE" "oci://$REPO"
