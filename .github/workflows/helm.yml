---
name: Helm

on:
  push:
    branches: [main, development]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: read

env:
  CHART: helm/hreidar
  HELM_VERSION: v4.3.1
  UNITTEST_VERSION: "1.2.1"

jobs:
  test:
    name: Lint y unit tests del chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Instalar helm-unittest
        # helm verifica la firma de los plugins y helm-unittest no publica una.
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$UNITTEST_VERSION" --verify=false

      - name: Correr helm lint
        run: helm lint --strict "$CHART"

      - name: Correr los unit tests del chart
        run: helm unittest "$CHART"

  package:
    name: Empaquetar y publicar el chart
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Empaquetar el chart
        id: package
        # En un tag, el chart se publica con la misma versión que la imagen;
        # fuera de un tag se usa la versión de Chart.yaml y solo se empaqueta.
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            helm package "$CHART" --destination dist \
              --version "$GITHUB_REF_NAME" --app-version "$GITHUB_REF_NAME"
          else
            helm package "$CHART" --destination dist
          fi
          echo "file=$(ls dist/*.tgz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ steps.package.outputs.file }}

      - name: Publicar el chart en GHCR
        if: github.ref_type == 'tag'
        env:
          FILE: ${{ steps.package.outputs.file }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "$FILE" "oci://ghcr.io/${OWNER,,}/charts"
